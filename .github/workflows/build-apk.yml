name: APK bauen

# Baut bei jedem Push (alle Branches) und von Hand über "Actions".
# Ein GitHub-Release mit der APK entsteht nur auf main/master – daraus liest
# die App ihre Update-Prüfung.
"on":
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"

concurrency:
  group: apk-bau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "==== FEHLER ===="
          grep -E "^e: |error:|What went wrong|AAPT|resource .* not found" -A2 build.log | head -120 || true

      - name: Bildschirmfotos erzeugen
        continue-on-error: true
        run: ./gradlew --no-daemon :app:recordPaparazziRelease 2>&1 | tail -40

      - name: Bildschirmfotos ablegen
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Bildschirmfotos
          path: app/src/test/snapshots/images/*.png
          if-no-files-found: ignore

      - name: Version ermitteln
        id: version
        run: |
          V=$(grep -E '^val appVersionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "SoldatenDashboardReloaded-v$V.apk"

      - name: APK als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: SoldatenDashboardReloaded-APK
          path: SoldatenDashboardReloaded-v*.apk

      - name: Release anlegen (nur main/master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SoldatenDashboardReloaded-v*.apk --clobber
          else
            gh release create "$TAG" SoldatenDashboardReloaded-v*.apk \
              --title "Soldaten Dashboard Reloaded $TAG" \
              --notes "Automatisch gebaut aus ${GITHUB_SHA::7}."
          fi
